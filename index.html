  #lock.open { opacity: 0; pointer-events: none; }
  .lock-text {
    position: absolute; top: 28vh; right: 4vw;
    text-align: right; font-family: 'Nanum Myeongjo', serif; font-weight: 700;
    font-size: clamp(24px, 6.4vw, 52px); line-height: 1.3; color: var(--ink);
    text-shadow: 0 0 12px rgba(247,243,236,.85), 0 0 2px rgba(247,243,236,.9);
  }
  .pin {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 11vh);
    transform: translateX(-50%); display: flex; gap: 10px;
  }
  .pin .box {
    width: 42px; height: 52px; background: rgba(247,243,236,.92);
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--ink);
  }
  .pin .box.now { box-shadow: inset 0 -2px 0 var(--ink-soft); }
  .pin input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; font-size: 16px; border: 0; background: transparent; color: transparent; caret-color: transparent;
  }

  #nope.show { opacity: 1; pointer-events: auto; }
  .nope-text {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 7vh);
    text-align: center; font-family: 'Nanum Myeongjo', serif; font-weight: 700;
    font-size: clamp(26px, 7.4vw, 56px); line-height: 1.35; color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.8);
  }

  /* ---------- 친구 얼굴 벽 ---------- */
  #wall { padding: calc(env(safe-area-inset-top) + 48px) 20px 120px; max-width: 720px; margin: 0 auto; }
  .wall-head { text-align: center; }
  .wall-head h1 { font-family: 'Nanum Myeongjo', serif; font-weight: 400; font-size: 26px; line-height: 1.4; }
  .wall-head .bar { width: 28px; height: 1px; background: var(--line); margin: 16px auto; }
  .wall-head p { font-size: 13px; color: var(--ink-soft); }
  .wall-head p.hint { font-size: 12px; color: var(--ink-mute); margin-top: 4px; }
  .faces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 16px; margin-top: 28px; }
  @media (min-width: 600px) { .faces { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .cell { min-width: 0; }
  .bub { height: 44px; margin-bottom: 8px; display: flex; flex-direction: column; justify-content: flex-end; }
  .bub div { position: relative; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.4; padding: 5px 10px; border-radius: 12px; }
  .bub span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; max-height: 2.8em; }
  .bub div::after { content: ""; position: absolute; left: 18px; bottom: -6px; border: 6px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
  .bub b { font-weight: 400; color: var(--line); margin-right: 5px; }
  .bub:empty { visibility: hidden; }
  .face { display: block; width: 100%; font: inherit; border: 0; cursor: pointer; background: #fff; padding: 5px 5px 10px; text-align: center; text-decoration: none; color: inherit;
          -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: transform .15s; }
  .face.pressing { transform: scale(.96); }
  .face .ph { aspect-ratio: 1; background: var(--photo-empty) center / cover no-repeat; }
  .face span { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 7px; }

  /* 아래로 안내 */
  .more { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; height: 120px; pointer-events: none;
          background: linear-gradient(rgba(247,243,236,0), var(--paper) 72%);
          display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
          padding-bottom: calc(env(safe-area-inset-bottom) + 18px); transition: opacity .3s; }
  .more.gone { opacity: 0; }
  .more .arrow { font-size: 14px; color: var(--ink); animation: bob 1.4s ease-in-out infinite; }
  .more .cnt { font-size: 11px; color: var(--ink-mute); margin-top: 2px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  /* 댓글 창 */
  .csheet { position: fixed; inset: 0; z-index: 26; background: rgba(44,44,42,.5); display: flex; align-items: flex-end; justify-content: center; }
  .csheet .panel { background: var(--paper); width: 100%; max-width: 560px; max-height: 82vh; display: flex; flex-direction: column;
                   padding: 18px 18px calc(env(safe-area-inset-bottom) + 14px); }
  .csheet .top { display: flex; align-items: center; gap: 12px; }
  .csheet .av { width: 48px; height: 48px; border-radius: 50%; background: var(--photo-empty) center / cover no-repeat; flex: none; }
  .csheet .who { flex: 1; font-family: 'Nanum Myeongjo', serif; font-size: 19px; }
  .csheet .x { font-size: 22px; color: var(--ink-mute); width: 40px; height: 40px; }
  .csheet .list { overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 14px; min-height: 80px; flex: 1; }
  .csheet .c { font-size: 15px; line-height: 1.55; padding: 7px 0; border-bottom: 0.5px solid #E5E0D6; word-break: break-all; }
  .csheet .c b { font-weight: 500; color: var(--ink-soft); margin-right: 6px; }
  .csheet .c small { display: block; font-size: 11px; color: var(--ink-mute); }
  .csheet .none { font-size: 13px; color: var(--ink-mute); text-align: center; padding: 26px 0; }
  .csheet form { display: flex; gap: 6px; margin-top: 12px; }
  .csheet input { font: inherit; font-size: 16px; border: 0.5px solid var(--line); background: #fff; padding: 9px 10px; border-radius: 0; min-width: 0; color: var(--ink); }
  .csheet input.name { width: 76px; flex: none; }
  .csheet input.body { flex: 1; }
  .csheet button.send { flex: none; background: var(--ink); color: #fff; padding: 0 14px; font-size: 14px; }

  /* ---------- 친구 방 ---------- */
  #room { min-height: 100vh; min-height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
          padding: calc(env(safe-area-inset-top) + 14px) 0 calc(env(safe-area-inset-bottom) + 16px); }
  .room-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 13px; color: var(--ink-soft); }
  .room-bar button { display: flex; align-items: center; gap: 4px; padding: 6px 0; }
  .room-name { text-align: center; font-family: 'Nanum Myeongjo', serif; font-size: 24px; margin-top: 14px; }
  .stage { flex: 1; display: flex; align-items: center; padding: 18px 24px 0; touch-action: pan-y; }
  .stage .pol { width: 100%; background: #fff; padding: 9px 9px 16px; }
  .stage .shot { width: 100%; aspect-ratio: 4 / 5; background: var(--photo-empty) center / cover no-repeat; }
  .empty { width: 100%; text-align: center; color: var(--ink-mute); font-size: 14px; line-height: 1.7; }
  .nav { display: flex; justify-content: center; gap: 28px; align-items: center; padding: 14px 24px 76px; color: var(--ink-mute); font-size: 13px; }
  .nav button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .nav button:disabled { opacity: .25; }

  /* + 버튼 */
  .fab { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 22px); z-index: 5;
         display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .fab .main { width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 28px; line-height: 1;
               display: flex; align-items: center; justify-content: center; transition: transform .2s; }
  .fab.open .main { transform: rotate(45deg); }
  .fab .opt { font-size: 14px; background: #fff; border: 0.5px solid var(--ink-mute); border-radius: 20px; padding: 8px 16px;
              opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .15s, transform .15s; }
  .fab.open .opt { opacity: 1; transform: none; pointer-events: auto; }
  .fab .opt.danger { color: #A32D2D; border-color: #A32D2D; }


  /* 앨범 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 16px; padding-bottom: 96px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .grid button { aspect-ratio: 1; background: var(--photo-empty) center / cover no-repeat; display: block; width: 100%; }
  .grid .empty { grid-column: 1 / -1; padding: 80px 0; }
  .picking { margin: 12px 18px 0; padding: 10px 14px; background: #fff; font-size: 13px; color: var(--ink-soft);
             display: flex; justify-content: space-between; align-items: center; }
  .picking button { font-size: 13px; color: var(--ink); text-decoration: underline; }

  /* 프로필 미리보기 */
  .sheet { position: fixed; inset: 0; z-index: 25; background: rgba(44,44,42,.55); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .sheet .card { background: var(--paper); width: 100%; max-width: 340px; padding: 24px 22px 20px; text-align: center; }
  .sheet h2 { font-family: 'Nanum Myeongjo', serif; font-weight: 400; font-size: 18px; }
  .sheet .hint { font-size: 12px; color: var(--ink-mute); margin-top: 6px; }
  .sheet .face { width: 150px; margin: 20px auto 0; }
  .sheet .row { display: flex; gap: 8px; margin-top: 22px; }
  .sheet .row button { flex: 1; padding: 11px 0; font-size: 14px; border: 0.5px solid var(--ink-mute); background: #fff; }
  .sheet .row button.ok { background: var(--ink); color: #fff; border-color: var(--ink); }

  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 16px); transform: translateX(-50%); z-index: 30;
           background: var(--ink); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 20px; white-space: nowrap;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-text">친구면<br>같이<br>ㄱㄱ</div>
  <div class="pin" id="pin">
    <div class="box now"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    <input id="code" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="비밀번호 4자리">
  </div>
</div>

<div id="nope" aria-live="assertive">
  <div class="nope-text">누….누귀야?<br>내래 노건우야</div>
</div>

<main id="wall">
  <div class="wall-head">
    <h1>초상권은<br>이미 포기했습니다</h1>
    <div class="bar"></div>
    <p>제일 못생기게 나온 얼굴 클릭 ㄱㄱ</p>
    <p class="hint">꾹 누르면 댓글 가능</p>
  </div>
  <div class="faces" id="faces"></div>
</main>
<div class="more" id="more"><div class="arrow">아래로 &#8595;</div><div class="cnt" id="moreCnt"></div></div>

<div class="csheet" id="csheet" hidden>
  <div class="panel" role="dialog" aria-label="댓글">
    <div class="top"><div class="av" id="cAv"></div><div class="who" id="cWho"></div><button class="x" id="cClose" type="button" aria-label="닫기">&#215;</button></div>
    <div class="list" id="cList"></div>
    <form id="cForm" autocomplete="off">
      <input class="name" id="cName" maxlength="20" placeholder="이름" aria-label="이름">
      <input class="body" id="cBody" maxlength="300" placeholder="댓글 달기…" aria-label="댓글">
      <button class="send" type="submit">등록</button>
    </form>
  </div>
</div>

<section id="room" hidden>
  <div class="room-bar">
    <button id="back" type="button">&#8249; 모두의 벽</button>
    <span id="count"></span>
  </div>
  <div class="room-name" id="roomName"></div>

  <div id="albumView">
    <div class="picking" id="picking" hidden>
      <span>프로필로 쓸 사진을 골라 주세요</span>
      <button id="pickCancel" type="button">취소</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="singleView" hidden>
    <div class="stage" id="stage"></div>
    <div class="nav">
      <button id="prev" type="button" aria-label="이전 사진">&#8249;</button>
      <span id="count2"></span>
      <button id="next" type="button" aria-label="다음 사진">&#8250;</button>
    </div>
  </div>

  <div class="fab" id="fab">
    <button class="opt danger" id="delBtn" type="button" hidden>이 사진 지우기</button>
    <button class="opt" id="addBtn" type="button">사진 올리기</button>
    <button class="opt" id="profBtn" type="button">프로필 바꾸기</button>
    <button class="main" id="fabMain" type="button" aria-label="메뉴 열기">+</button>
  </div>
  <input id="addInput" type="file" accept="image/*" multiple hidden>
</section>

<div class="sheet" id="dsheet" hidden>
  <div class="card">
    <h2>이 사진을 지울까요?</h2>
    <p class="hint">친구들 화면에서 사라져요</p>
    <div class="row">
      <button id="delNo" type="button">취소</button>
      <button class="ok" id="delYes" type="button">지우기</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card">
    <h2>프로필이 이렇게 보여요</h2>
    <p class="hint">얼굴 벽에는 가운데가 네모로 잘려 들어가요</p>
    <div class="face"><div class="ph" id="previewPh"></div><span id="previewName"></span></div>
    <div class="row">
      <button id="sheetBack" type="button">다시 고르기</button>
      <button class="ok" id="sheetOk" type="button">이걸로 할게요</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ===== 설정 ===== */
  var PASSWORD = '0909';
  var SUPABASE_URL = 'https://rzjpqjspnvvfcxexuswz.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_q2h9qnVlmxK4yuIbG1-E1g_6BYeouEi';
  var BUCKET = 'photos';
  var FRIENDS = [
    { id: 'f01', name: '수호' }, { id: 'f02', name: '건우' }, { id: 'f03', name: '원일' },
    { id: 'f04', name: '현서' }, { id: 'f05', name: '수영' }, { id: 'f06', name: '인우' },
    { id: 'f07', name: '동림' }, { id: 'f08', name: '준명' }, { id: 'f09', name: '정빈' },
    { id: 'f10', name: '준영' }
  ];

  var sb = null;
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };

  /* ===== 알림 ===== */
  var toastTimer;
  function toast(msg, stay) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    if (!stay) toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ===== 비밀번호 ===== */
  var lock = $('lock'), pin = $('pin'), code = $('code'), boxes = pin.querySelectorAll('.box');
  try { if (sessionStorage.getItem('ok') === '1') lock.classList.add('open'); } catch (e) {}

  function draw() {
    var v = code.value;
    for (var i = 0; i < 4; i++) {
      boxes[i].textContent = i < v.length ? '•' : '';
      boxes[i].classList.toggle('now', i === v.length);
    }
  }
  var nope = $('nope'), nopeTimer;
  function showNope() { nope.classList.add('show'); clearTimeout(nopeTimer); nopeTimer = setTimeout(hideNope, 2500); }
  function hideNope() { clearTimeout(nopeTimer); nope.classList.remove('show'); }
  nope.addEventListener('click', hideNope);

  code.addEventListener('input', function () {
    code.value = code.value.replace(/[^0-9]/g, '').slice(0, 4);
    draw();
    if (code.value.length === 4) {
      if (code.value === PASSWORD) {
        try { sessionStorage.setItem('ok', '1'); } catch (e) {}
        code.blur(); lock.classList.add('open'); setTimeout(updateMore, 50);
      } else {
        code.blur(); code.value = ''; draw(); showNope();
      }
    }
  });

  /* ===== 저장소 ===== */
  function publicUrl(path, ver) {
    var u = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    return ver ? u + '?v=' + encodeURIComponent(ver) : u;
  }
  function listFolder(path) {
    if (!sb) return Promise.resolve([]);
    return sb.storage.from(BUCKET).list(path, { limit: 1000, sortBy: { column: 'created_at', order: 'asc' } })
      .then(function (r) { if (r.error) throw r.error; return (r.data || []).filter(function (f) { return f.id; }); });
  }

  /* 사진 줄이기: 긴 쪽 maxSide px, 정사각형이면 가운데를 잘라냄. 위치 정보 등은 남지 않음 */
  function shrink(file, maxSide, square) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
        if (square) { var s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
        var scale = Math.min(1, maxSide / Math.max(sw, sh));
        var c = document.createElement('canvas');
        c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('변환 실패')); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 못 읽음')); };
      img.src = url;
    });
  }

  /* ===== 얼굴 벽 ===== */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var profileUrl = {};

  function renderWall() {
    $('faces').innerHTML = FRIENDS.map(function (f) {
      return '<div class="cell"><div class="bub" id="bub-' + f.id + '"></div>' +
             '<button type="button" class="face" data-id="' + f.id + '"><div class="ph" id="ph-' + f.id + '"></div><span>' + esc(f.name) + '</span></button></div>';
    }).join('');
    FRIENDS.forEach(loadProfile);
    loadComments();
  }
  function loadProfile(f) {
    listFolder(f.id).then(function (files) {
      var p = files.filter(function (x) { return x.name === 'profile.jpg'; })[0];
      var el = $('ph-' + f.id);
      if (p && el) {
        profileUrl[f.id] = publicUrl(f.id + '/profile.jpg', p.updated_at || p.created_at);
        el.style.backgroundImage = 'url("' + profileUrl[f.id] + '")';
      }
    }).catch(function () {});
  }

  /* 꾹 누르기 = 댓글, 짧게 누르기 = 방으로 */
  var pressTimer = null, pressed = false, pressEl = null, startY = 0;
  $('faces').addEventListener('touchstart', function (e) {
    var a = e.target.closest('.face'); if (!a) return;
    pressed = false; pressEl = a; startY = e.touches[0].clientY; a.classList.add('pressing');
    pressTimer = setTimeout(function () {
      pressed = true; a.classList.remove('pressing');
      if (navigator.vibrate) navigator.vibrate(15);
      openComments(a.getAttribute('data-id'));
    }, 500);
  }, { passive: true });
  function cancelPress() { clearTimeout(pressTimer); if (pressEl) pressEl.classList.remove('pressing'); }
  $('faces').addEventListener('touchmove', function (e) { if (Math.abs(e.touches[0].clientY - startY) > 10) cancelPress(); }, { passive: true });
  $('faces').addEventListener('touchend', cancelPress);
  $('faces').addEventListener('touchcancel', cancelPress);
  $('faces').addEventListener('contextmenu', function (e) {
    var a = e.target.closest('.face'); if (!a) return;
    e.preventDefault();
    if (!pressed) { pressed = true; cancelPress(); openComments(a.getAttribute('data-id')); }   /* 컴퓨터: 오른쪽 클릭 */
  });
  $('faces').addEventListener('click', function (e) {
    var a = e.target.closest('.face'); if (!a) return;
    e.preventDefault();
    if (pressed) { pressed = false; return; }
    goTo(a.getAttribute('data-id'));
  });

  /* 아래로 안내: 처음 화면에서만, 한 번 내리면 사라짐 */
  function updateMore() {
    var m = $('more');
    var canScroll = document.documentElement.scrollHeight - window.innerHeight > 60;
    var onWall = !$('wall').hidden && lock.classList.contains('open');
    m.hidden = !(canScroll && onWall);
    m.classList.toggle('gone', window.scrollY > 40);
    if (!m.hidden) {
      var shown = 0;
      document.querySelectorAll('.face').forEach(function (a) { if (a.getBoundingClientRect().bottom <= window.innerHeight - 90) shown++; });
      $('moreCnt').textContent = FRIENDS.length + '명 중 ' + Math.max(1, shown) + '명';
    }
  }
  window.addEventListener('scroll', updateMore, { passive: true });
  window.addEventListener('resize', updateMore);

  /* ===== 댓글 ===== */
  var comments = [], commentFriend = null, commentsOk = true;
  function loadComments() {
    if (!sb) return Promise.resolve();
    return sb.from('comments').select('friend,author,body,created_at').order('created_at', { ascending: true }).limit(2000)
      .then(function (r) {
        if (r.error) throw r.error;
        commentsOk = true; comments = r.data || []; drawBubbles();
        if (commentFriend) drawCommentList();
      }).catch(function () { commentsOk = false; if (commentFriend) drawCommentList(); });
  }
  function drawBubbles() {
    FRIENDS.forEach(function (f) {
      var last = null;
      comments.forEach(function (c) { if (c.friend === f.id) last = c; });
      var el = $('bub-' + f.id); if (!el) return;
      el.innerHTML = last ? '<div><span><b>' + esc(last.author) + '</b>' + esc(last.body) + '</span></div>' : '';
    });
  }
  function ago(t) {
    var d = (Date.now() - new Date(t).getTime()) / 1000;
    if (d < 60) return '방금';
    if (d < 3600) return Math.floor(d / 60) + '분 전';
    if (d < 86400) return Math.floor(d / 3600) + '시간 전';
    if (d < 86400 * 30) return Math.floor(d / 86400) + '일 전';
    var x = new Date(t); return (x.getMonth() + 1) + '월 ' + x.getDate() + '일';
  }
  function drawCommentList() {
    var list = $('cList');
    if (!commentsOk) { list.innerHTML = '<div class="none">댓글을 못 불러왔어요.<br>잠시 뒤 다시 열어 보세요.</div>'; return; }
    var mine = comments.filter(function (c) { return c.friend === commentFriend; });
    list.innerHTML = mine.length ? mine.map(function (c) {
      return '<div class="c"><b>' + esc(c.author) + '</b>' + esc(c.body) + '<small>' + ago(c.created_at) + '</small></div>';
    }).join('') : '<div class="none">아직 댓글이 없어요. 첫 댓글 ㄱㄱ</div>';
    list.scrollTop = list.scrollHeight;
  }
  function openComments(id) {
    var f = FRIENDS.filter(function (x) { return x.id === id; })[0]; if (!f) return;
    commentFriend = id;
    $('cWho').textContent = f.name;
    $('cAv').style.backgroundImage = profileUrl[id] ? 'url("' + profileUrl[id] + '")' : '';
    try { $('cName').value = localStorage.getItem('cname') || ''; } catch (e) {}
    $('csheet').hidden = false;
    drawCommentList(); loadComments();
  }
  function closeComments() { $('csheet').hidden = true; commentFriend = null; document.activeElement && document.activeElement.blur(); }
  $('cClose').addEventListener('click', closeComments);
  $('csheet').addEventListener('click', function (e) { if (e.target === $('csheet')) closeComments(); });

  var sending = false;
  $('cForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var author = $('cName').value.trim(), body = $('cBody').value.trim();
    if (!author) { toast('이름을 적어 주세요'); $('cName').focus(); return; }
    if (!body) { toast('댓글을 적어 주세요'); $('cBody').focus(); return; }
    if (sending || !sb || !commentFriend) return;
    sending = true;
    try { localStorage.setItem('cname', author); } catch (err) {}
    sb.from('comments').insert({ friend: commentFriend, author: author, body: body }).then(function (r) {
      sending = false;
      if (r.error) throw r.error;
      $('cBody').value = '';
      return loadComments();
    }).catch(function () { sending = false; toast('댓글을 못 올렸어요. 다시 해 주세요'); });
  });

  /* ===== 친구 방 ===== */
  var current = null, photos = [], idx = 0, view = 'album', picking = false, chosen = null;

  /* 이 휴대폰 표시 (사진 이름에 넣어서 "내가 올린 사진"을 알아봄) */
  var DEVICE = '';
  try {
    DEVICE = localStorage.getItem('did') || '';
    if (!DEVICE) { DEVICE = Math.random().toString(36).slice(2, 10); localStorage.setItem('did', DEVICE); }
  } catch (e) { DEVICE = ''; }
  function isMine(path) { return !!DEVICE && path.split('/').pop().indexOf('-' + DEVICE + '-') > 0; }
  function updateDelBtn() {
    $('delBtn').hidden = !(view === 'single' && photos[idx] && isMine(photos[idx]));
  }

  function openRoom(f) {
    current = f; photos = []; idx = 0;
    $('wall').hidden = true; $('room').hidden = false; window.scrollTo(0, 0);
    $('roomName').textContent = f.name;
    closeFab(); setPicking(false); $('sheet').hidden = true;
    setView('album');
    $('grid').innerHTML = '<div class="empty">불러오는 중…</div>';
    loadPhotos(f);
  }
  function loadPhotos(f) {
    return listFolder(f.id + '/pics').then(function (files) {
      if (current !== f) return;
      photos = files.map(function (x) { return f.id + '/pics/' + x.name; }).reverse(); /* 최신 사진이 맨 앞 */
      idx = Math.min(idx, Math.max(0, photos.length - 1));
      $('count').textContent = photos.length ? photos.length + '장' : '';
      renderGrid(); if (view === 'single') showPhoto();
    }).catch(function () {
      if (current !== f) return;
      $('grid').innerHTML = '<div class="empty">사진을 못 불러왔어요.<br>잠시 뒤 새로고침해 보세요.</div>';
    });
  }

  function setView(v) {
    view = v;
    $('albumView').hidden = v !== 'album';
    $('singleView').hidden = v !== 'single';
    $('back').innerHTML = v === 'single' ? '&#8249; 앨범' : '&#8249; 모두의 벽';
    closeFab(); updateDelBtn();
    window.scrollTo(0, 0);
  }

  function renderGrid() {
    if (!photos.length) {
      $('grid').innerHTML = '<div class="empty">아직 사진이 없어요.<br>오른쪽 아래 + 로 첫 사진을 올려 주세요.</div>';
      return;
    }
    $('grid').innerHTML = photos.map(function (p, i) {
      return '<button type="button" data-i="' + i + '" aria-label="사진 ' + (i + 1) + '" style="background-image:url(&quot;' + publicUrl(p) + '&quot;)"></button>';
    }).join('');
  }
  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]'); if (!b) return;
    var i = +b.getAttribute('data-i');
    if (picking) { openSheet(photos[i]); }
    else { idx = i; setView('single'); showPhoto(); }
  });

  function showPhoto() {
    var n = photos.length;
    $('count2').textContent = n ? (idx + 1) + ' / ' + n : '';
    $('prev').disabled = idx <= 0; $('next').disabled = idx >= n - 1;
    if (!n) { setView('album'); return; }
    $('stage').innerHTML = '<div class="pol"><div class="shot" style="background-image:url(&quot;' + publicUrl(photos[idx]) + '&quot;)"></div></div>';
    if (photos[idx + 1]) (new Image()).src = publicUrl(photos[idx + 1]);
    updateDelBtn();
  }
  function go(step) {
    var j = idx + step;
    if (j < 0 || j >= photos.length) return;
    idx = j; showPhoto();
  }
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('back').addEventListener('click', function () {
    if (view === 'single') setView('album'); else goTo('');
  });

  var tx = null;
  $('stage').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
  });

  /* + 버튼 */
  function closeFab() { $('fab').classList.remove('open'); }
  $('fabMain').addEventListener('click', function () { $('fab').classList.toggle('open'); });
  $('addBtn').addEventListener('click', function () { closeFab(); $('addInput').click(); });
  $('profBtn').addEventListener('click', function () {
    closeFab();
    if (!photos.length) { toast('먼저 사진을 올려 주세요'); return; }
    setView('album'); setPicking(true);
  });

  /* 사진 지우기: 올린 휴대폰에서만, 휴지통 폴더로 옮김 */
  $('delBtn').addEventListener('click', function () {
    closeFab();
    if (view === 'single' && photos[idx] && isMine(photos[idx])) $('dsheet').hidden = false;
  });
  $('delNo').addEventListener('click', function () { $('dsheet').hidden = true; });
  $('delYes').addEventListener('click', function () {
    $('dsheet').hidden = true;
    var f = current, path = photos[idx];
    if (!f || !path || !sb || !isMine(path)) return;
    toast('지우는 중…', true);
    sb.storage.from(BUCKET).move(path, 'trash/' + path.replace('/pics/', '/')).then(function (r) {
      if (r.error) throw r.error;
      toast('지웠어요');
      if (current !== f) return;
      photos.splice(photos.indexOf(path), 1);
      $('count').textContent = photos.length ? photos.length + '장' : '';
      idx = Math.min(idx, photos.length - 1);
      renderGrid();
      if (photos.length) showPhoto(); else setView('album');
    }).catch(function () { toast('못 지웠어요. 다시 해 주세요'); });
  });

  /* 사진 올리기 */
  $('addInput').addEventListener('change', function () {
    var files = Array.prototype.slice.call(this.files || []); this.value = '';
    if (!files.length || !current || !sb) return;
    var f = current, done = 0, failed = 0;
    toast('올리는 중… 0/' + files.length, true);
    files.reduce(function (chain, file, i) {
      return chain.then(function () {
        return shrink(file, 1600, false).then(function (blob) {
          var name = Date.now() + '-' + (DEVICE ? DEVICE + '-' : '') + Math.random().toString(36).slice(2, 7) + '.jpg';
          return sb.storage.from(BUCKET).upload(f.id + '/pics/' + name, blob, { contentType: 'image/jpeg', upsert: false });
        }).then(function (r) { if (r.error) throw r.error; done++; })
          .catch(function () { failed++; })
          .then(function () { toast('올리는 중… ' + (i + 1) + '/' + files.length, true); });
      });
    }, Promise.resolve()).then(function () {
      toast(failed ? done + '장 올림, ' + failed + '장 실패' : done + '장 올렸어요');
      if (current === f) { idx = 0; setView('album'); loadPhotos(f); }
    });
  });

  /* 프로필 바꾸기: 앨범에서 고르기 → 미리보기 → 확정 */
  function setPicking(on) {
    picking = on; $('picking').hidden = !on;
    $('fab').hidden = on;
  }
  $('pickCancel').addEventListener('click', function () { setPicking(false); });

  function openSheet(path) {
    chosen = path;
    $('previewPh').style.backgroundImage = 'url("' + publicUrl(path) + '")';
    $('previewName').textContent = current ? current.name : '';
    $('sheet').hidden = false;
  }
  $('sheetBack').addEventListener('click', function () { $('sheet').hidden = true; chosen = null; });
  $('sheetOk').addEventListener('click', function () {
    if (!chosen || !current || !sb) return;
    var f = current, path = chosen;
    $('sheet').hidden = true; setPicking(false);
    toast('프로필 바꾸는 중…', true);
    fetch(publicUrl(path)).then(function (r) { if (!r.ok) throw new Error('불러오기 실패'); return r.blob(); })
      .then(function (b) { return shrink(b, 600, true); })
      .then(function (blob) {
        return sb.storage.from(BUCKET).upload(f.id + '/profile.jpg', blob, { contentType: 'image/jpeg', upsert: true, cacheControl: '60' });
      }).then(function (r) {
        if (r.error) throw r.error;
        toast(f.name + ' 프로필을 바꿨어요');
        loadProfile(f);
      }).catch(function () { toast('못 바꿨어요. 다시 해 주세요'); });
  });

  /* ===== 화면 이동 (#/f01 → 수호 방) ===== */
  /* 주소 뒤 #/f01 은 뒤로 가기 버튼용. 미리보기처럼 주소를 못 바꾸는 곳에서도 화면은 바로 바뀌게 함 */
  function show(id) {
    var f = FRIENDS.filter(function (x) { return x.id === id; })[0];
    if (f) { if (current !== f || $('room').hidden) openRoom(f); }
    else { current = null; $('room').hidden = true; $('wall').hidden = false; }
    setTimeout(updateMore, 50);
  }
  function goTo(id) {
    try { var want = id ? '#/' + id : ''; if (location.hash.replace(/^#$/, '') !== want) location.hash = want; } catch (e) {}
    show(id);
  }
  window.addEventListener('hashchange', function () { show(location.hash.replace('#/', '')); });

  renderWall();
  show(location.hash.replace('#/', ''));
  if (!sb) toast('사진 서버에 연결을 못 했어요. 새로고침해 보세요');
</script>
</body>
</html>
