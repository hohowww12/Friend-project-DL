  #lock.open { opacity: 0; pointer-events: none; }

  .lock-text {
    position: absolute; top: 28vh; right: 4vw;
    text-align: right; font-family: 'Nanum Myeongjo', serif; font-weight: 700;
    font-size: clamp(24px, 6.4vw, 52px); line-height: 1.3; color: var(--ink);
    text-shadow: 0 0 12px rgba(247,243,236,.85), 0 0 2px rgba(247,243,236,.9);
  }

  .pin {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 11vh);
    transform: translateX(-50%);
    display: flex; gap: 10px;
  }
  .pin .box {
    width: 42px; height: 52px; background: rgba(247,243,236,.92);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--ink);
  }
  .pin .box.now { box-shadow: inset 0 -2px 0 var(--ink-soft); }
  .pin input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; font-size: 16px; border: 0; background: transparent;
    color: transparent; caret-color: transparent;
  }
  .pin.shake { animation: shake .4s; }
  @keyframes shake {
    20%, 60% { transform: translateX(calc(-50% - 8px)); }
    40%, 80% { transform: translateX(calc(-50% + 8px)); }
  }

  /* ---------- 친구 얼굴 벽 (사진 받으면 채울 예정) ---------- */
  #wall { min-height: 100%; padding: calc(env(safe-area-inset-top) + 48px) 20px 48px; max-width: 720px; margin: 0 auto; }
  .wall-head { text-align: center; }
  .wall-head h1 { font-family: 'Nanum Myeongjo', serif; font-weight: 400; font-size: 26px; line-height: 1.4; }
  .wall-head .bar { width: 28px; height: 1px; background: var(--line); margin: 16px auto; }
  .wall-head p { font-size: 13px; color: var(--ink-soft); }
  .faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
  @media (min-width: 600px) { .faces { grid-template-columns: repeat(5, 1fr); } }
  .face { background: #fff; padding: 5px 5px 10px; text-align: center; }
  .face .ph { aspect-ratio: 1; background: var(--photo-empty); }
  .face span { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-text">친구면<br>같이<br>ㄱㄱ</div>
  <div class="pin" id="pin">
    <div class="box now"></div><div class="box"></div><div class="box"></div><div class="box"></div>
    <input id="code" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="비밀번호 4자리">
  </div>
</div>

<main id="wall">
  <div class="wall-head">
    <h1>초상권은<br>이미 포기했습니다</h1>
    <div class="bar"></div>
    <p>제일 못생기게 나온 얼굴부터 눌러 보세요</p>
  </div>
  <div class="faces">
    <div class="face"><div class="ph"></div><span>친구1</span></div>
    <div class="face"><div class="ph"></div><span>친구2</span></div>
    <div class="face"><div class="ph"></div><span>친구3</span></div>
    <div class="face"><div class="ph"></div><span>친구4</span></div>
    <div class="face"><div class="ph"></div><span>친구5</span></div>
    <div class="face"><div class="ph"></div><span>친구6</span></div>
    <div class="face"><div class="ph"></div><span>친구7</span></div>
    <div class="face"><div class="ph"></div><span>친구8</span></div>
    <div class="face"><div class="ph"></div><span>친구9</span></div>
    <div class="face"><div class="ph"></div><span>친구10</span></div>
  </div>
</main>

<script>
  var PASSWORD = '0909';
  var lock = document.getElementById('lock');
  var pin = document.getElementById('pin');
  var code = document.getElementById('code');
  var boxes = pin.querySelectorAll('.box');

  function unlocked() {
    try { return sessionStorage.getItem('ok') === '1'; } catch (e) { return false; }
  }
  if (unlocked()) lock.classList.add('open');

  function draw() {
    var v = code.value;
    for (var i = 0; i < 4; i++) {
      boxes[i].textContent = i < v.length ? '•' : '';
      boxes[i].classList.toggle('now', i === v.length);
    }
  }

  code.addEventListener('input', function () {
    code.value = code.value.replace(/[^0-9]/g, '').slice(0, 4);
    draw();
    if (code.value.length === 4) {
      if (code.value === PASSWORD) {
        try { sessionStorage.setItem('ok', '1'); } catch (e) {}
        code.blur();
        lock.classList.add('open');
      } else {
        pin.classList.add('shake');
        setTimeout(function () {
          pin.classList.remove('shake');
          code.value = '';
          draw();
        }, 400);
      }
    }
  });
</script>
</body>
</html>
